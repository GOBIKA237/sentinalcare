events {
    worker_connections 1024;
}

http {
    # Edge-level rate limiting, ahead of Express's own limiter in rateLimiter.js.
    # Two layers: nginx sheds obvious abuse cheaply, Express enforces
    # per-route policy (e.g. tighter limits on /api/auth/*).
    limit_req_zone $binary_remote_addr zone=general_zone:10m rate=20r/s;

    upstream node_api {
        server node-api:4000;
    }

    server {
        listen 80;

        location /api/ {
            limit_req zone=general_zone burst=40 nodelay;
            proxy_pass http://node_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://node_api/api/health;
        }
    }
}
